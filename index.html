<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>クイヤゲーム改</title>
<style>
  :root{
    --orange:#ee7d0e;
    --orange-dark:#c96409;
    --red:#c41230;
    --panel:#f7faf9;
    --ink:#2b2b2b;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{
    margin:0; padding:0; width:100%; height:100%;
    overflow:hidden; overscroll-behavior:none;
    background:#94d9f4;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Sans","Yu Gothic",system-ui,sans-serif;
    touch-action:none; user-select:none;
  }
  #stage{position:fixed; inset:0;}
  canvas{display:block; width:100%; height:100%;}

  .overlay{
    position:fixed; inset:0; display:flex; align-items:center; justify-content:center;
    flex-direction:column; gap:14px; text-align:center; padding:24px;
    background:rgba(70,95,105,0.55);
    color:var(--ink); z-index:10;
  }
  .hidden{display:none !important;}

  .panel{
    background:var(--panel);
    border-radius:18px;
    padding:34px 40px;
    box-shadow:0 12px 30px rgba(0,0,0,0.35);
    display:flex; flex-direction:column; align-items:center; gap:12px;
    max-width:380px;
  }

  .title{
    font-weight:700;
    font-size:clamp(2rem, 8.5vw, 2.8rem);
    color:var(--red);
    letter-spacing:0.01em;
  }
  .sub{
    font-size:clamp(0.85rem, 3.5vw, 1rem);
    line-height:1.85;
    color:#3a3a3a;
    max-width:340px;
  }
  .sub b.ok{color:#1e9e4c;}
  .sub b.ng{color:var(--red);}

  .btn{
    font-weight:700; font-size:1.1rem;
    color:#fff;
    background:linear-gradient(180deg,#f6a13f,var(--orange));
    border:none; border-radius:999px;
    padding:13px 44px;
    box-shadow:0 5px 0 var(--orange-dark), 0 8px 16px rgba(0,0,0,0.25);
    cursor:pointer;
  }
  .btn:active{ transform:translateY(3px); box-shadow:0 2px 0 var(--orange-dark), 0 4px 8px rgba(0,0,0,0.25); }

  .score-final{ font-size:clamp(1.15rem,5vw,1.35rem); color:#333; }
  .score-final b{ font-size:1.15em; color:#1a1a1a; }
  .record{
    font-weight:800; color:var(--orange);
    font-size:1rem; letter-spacing:0.02em;
  }
  .reason{ font-size:0.85rem; color:#6b6b6b; margin-top:-4px; }
</style>
</head>
<body>
<div id="stage"><canvas id="c"></canvas></div>

<div id="startOverlay" class="overlay">
  <div class="panel">
    <div class="title" style="font-size:clamp(1.6rem,7vw,2.2rem);">クイヤゲーム</div>
    <div class="sub">
      タップでジャンプ！クイヤを走らせよう。<br>
      <b class="ok">1〜8のコイン</b>を集めてスコアアップ。<br>
      <b class="ng">9</b>に触れる・ブロックに横から激突・穴に落ちるとゲームオーバー。
    </div>
    <button class="btn" id="startBtn">タップでスタート</button>
  </div>
</div>

<div id="overOverlay" class="overlay hidden">
  <div class="panel">
    <div class="title">GAME OVER</div>
    <div id="recordText" class="record hidden">🎉 NEW RECORD!! 🎉</div>
    <div class="reason" id="reasonText"></div>
    <div class="score-final">スコア: <b id="finalScore">0</b></div>
    <div class="score-final">ハイスコア: <b id="finalHi">0</b></div>
    <button class="btn" id="retryBtn">もう一度</button>
  </div>
</div>

<script>
(() => {
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  const startOverlay = document.getElementById('startOverlay');
  const overOverlay = document.getElementById('overOverlay');
  const startBtn = document.getElementById('startBtn');
  const retryBtn = document.getElementById('retryBtn');

  let DPR = Math.min(window.devicePixelRatio || 1, 2);
  let W = 0, H = 0;

  let BS = 40;
  let GROUND0_Y = 0;
  let GRAVITY = 1600;
  let JUMP_V = -700;
  let AIR_TIME = 0.8;
  let BASE_SPEED = 220;
  let MAX_SPEED = 420;
  let MAX_HOLE_COLS = 2;
  let MAX_WALL_STEP = 2;
  const MAX_LEVEL = 4;
  const PLAYER_SCREEN_X_RATIO = 0.28;

  function recalcPhysics() {
    BS = Math.max(24, Math.min(48, H * 0.062));
    GROUND0_Y = H * 0.72;
    GRAVITY = BS * 42;
    JUMP_V = -BS * 14.9;
    AIR_TIME = (2 * Math.abs(JUMP_V)) / GRAVITY;
    BASE_SPEED = BS * 7.4;
    MAX_SPEED = BS * 12.5;
    MAX_HOLE_COLS = Math.max(1, Math.floor((BASE_SPEED * AIR_TIME) / BS) - 1);
    const jumpHeightBlocks = (JUMP_V * JUMP_V) / (2 * GRAVITY) / BS;
    MAX_WALL_STEP = Math.min(2, Math.max(1, Math.floor(jumpHeightBlocks * 0.8)));
  }

  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = Math.floor(W * DPR);
    canvas.height = Math.floor(H * DPR);
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    recalcPhysics();
    initClouds();
  }

  function groundYForLevel(level) { return GROUND0_Y - level * BS; }

  let columns = [];
  let coins = [];
  let genIndex = 0;
  let curLevel = 1;
  let flatRunRemaining = 18;
  let sinceHole = 0, sinceWall = 0;
  let nextCoinIn = 4;
  let lastCoinValue = -1, sameValueStreak = 0;
  let sinceNine = 2;

  function resetTerrain() {
    columns = [];
    coins = [];
    genIndex = 0;
    curLevel = 1;
    flatRunRemaining = 18;
    sinceHole = 0; sinceWall = 0;
    nextCoinIn = 6;
    lastCoinValue = -1; sameValueStreak = 0;
    sinceNine = 2;
  }

  function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }

  function generateColumn() {
    genIndex++;
    sinceHole++; sinceWall++;

    if (flatRunRemaining > 0) {
      flatRunRemaining--;
    } else {
      const pHole = sinceHole >= 6 ? clamp(0.05 + (sinceHole - 6) * 0.022, 0, 0.5) : 0;
      const pWall = sinceWall >= 8 ? clamp(0.04 + (sinceWall - 8) * 0.018, 0, 0.38) : 0;
      const roll = Math.random();
      if (roll < pHole) {
        const width = 1 + Math.floor(Math.random() * MAX_HOLE_COLS);
        const holeStartWorldX = columns.length * BS;
        for (let i = 0; i < width; i++) columns.push({ level: curLevel, hole: true });
        sinceHole = 0;
        flatRunRemaining = 6;
        spawnHoleArcCoins(holeStartWorldX, width);
        return;
      } else if (roll < pHole + pWall) {
        curLevel = clamp(curLevel + MAX_WALL_STEP, 0, MAX_LEVEL);
        columns.push({ level: curLevel, hole: false, wallFace: true });
        sinceWall = 0;
        flatRunRemaining = 6;
        return;
      } else if (Math.random() < 0.12) {
        curLevel = clamp(curLevel + (Math.random() < 0.5 ? -1 : 1), 0, MAX_LEVEL);
      }
    }
    columns.push({ level: curLevel, hole: false });
    maybeSpawnCoin();
  }

  function spawnHoleArcCoins(holeStartWorldX, widthCols) {
    // ジャンプの放物線に沿ってコインを並べ、跳ぶタイミングと軌道を誘導する
    const jumpHeightBlocks = (JUMP_V * JUMP_V) / (2 * GRAVITY) / BS;
    const peak = BS * jumpHeightBlocks * 0.7;
    const groundY = groundYForLevel(curLevel);
    for (let i = 0; i < widthCols; i++) {
      const frac = (i + 0.5) / widthCols;
      const x = holeStartWorldX + frac * widthCols * BS;
      const y = groundY - BS * 0.75 - peak * 4 * frac * (1 - frac);
      let value = 1 + Math.floor(Math.random() * 8);
      if (value === lastCoinValue) value = 1 + Math.floor(Math.random() * 8);
      lastCoinValue = value;
      coins.push({ x, y, value, taken: false });
    }
  }

  function maybeSpawnCoin() {
    nextCoinIn--;
    if (nextCoinIn > 0) return;
    nextCoinIn = 3 + Math.floor(Math.random() * 4);

    sinceNine++;
    const p9 = sinceNine >= 3 ? clamp(0.08 + (sinceNine - 3) * 0.05, 0, 0.32) : 0;
    let value;
    if (Math.random() < p9) {
      value = 9;
      sinceNine = 0;
    } else {
      value = 1 + Math.floor(Math.random() * 8);
      if (value === lastCoinValue) {
        sameValueStreak++;
        if (sameValueStreak >= 2) { value = 1 + Math.floor(Math.random() * 8); sameValueStreak = 0; }
      } else { sameValueStreak = 0; }
      lastCoinValue = value;
    }
    const col = columns[columns.length - 1];
    const gy = groundYForLevel(col.level);
    const heightAbove = BS * (1.5 + Math.random() * 1.2);
    const x = (columns.length - 1) * BS + BS / 2;
    coins.push({ x, y: gy - heightAbove, value, taken: false });
  }

  function ensureGenerated(uptoWorldX) {
    while (columns.length * BS < uptoWorldX) generateColumn();
  }

  let clouds = [];
  function initClouds() {
    clouds = [];
    for (let i = 0; i < 6; i++) {
      clouds.push({ x: Math.random() * 1000, y: H * (0.08 + Math.random() * 0.3), s: 0.6 + Math.random() * 0.8, speed: 6 + Math.random() * 10 });
    }
  }
  function drawCloud(x, y, s) {
    ctx.save();
    ctx.translate(x, y);
    ctx.scale(s, s);
    ctx.fillStyle = 'rgba(255,255,255,0.85)';
    ctx.beginPath();
    ctx.arc(0, 0, 22, 0, Math.PI * 2);
    ctx.arc(24, -8, 18, 0, Math.PI * 2);
    ctx.arc(46, 0, 20, 0, Math.PI * 2);
    ctx.arc(22, 10, 24, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  let player = { x: 0, y: 0, w: 0, h: 0, vy: 0, onGround: true, level: 1, animT: 0, coyote: 0, jumpBuffer: 0 };

  function resetPlayer() {
    player.w = BS * 0.82;
    player.h = BS * 0.82;
    player.level = 1;
    player.y = groundYForLevel(player.level) - player.h;
    player.vy = 0;
    player.onGround = true;
    player.animT = 0;
    player.coyote = 0;
    player.jumpBuffer = 0;
  }

  function drawKuiya(px, py, w, h, onGround, animT) {
    ctx.save();
    ctx.translate(px + w / 2, py + h);
    const bob = onGround ? Math.sin(animT * 14) * h * 0.04 : 0;
    ctx.translate(0, bob);

    // 平たい尻尾(ビーバー)
    ctx.fillStyle = '#5c4028';
    ctx.beginPath();
    ctx.ellipse(-w * 0.5, -h * 0.32, w * 0.2, h * 0.14, -0.35, 0, Math.PI * 2);
    ctx.fill();

    // 足
    ctx.fillStyle = '#6b4a2c';
    const legSwing = onGround ? Math.sin(animT * 16) * h * 0.12 : 0;
    ctx.fillRect(-w * 0.24, -h * 0.1 + legSwing, w * 0.16, h * 0.14);
    ctx.fillRect(w * 0.06, -h * 0.1 - legSwing, w * 0.16, h * 0.14);

    // 体(茶色、下部に明るい腹)
    const bodyGrad = ctx.createRadialGradient(-w * 0.1, -h * 0.62, w * 0.1, -w * 0.02, -h * 0.4, w * 0.62);
    bodyGrad.addColorStop(0, '#a97a4e');
    bodyGrad.addColorStop(1, '#8a5a34');
    ctx.beginPath();
    ctx.ellipse(0, -h * 0.42, w * 0.48, h * 0.4, 0, 0, Math.PI * 2);
    ctx.fillStyle = bodyGrad;
    ctx.fill();
    ctx.beginPath();
    ctx.ellipse(-w * 0.02, -h * 0.28, w * 0.3, h * 0.2, 0, 0, Math.PI * 2);
    ctx.fillStyle = '#c9a877';
    ctx.fill();

    // 頭
    ctx.beginPath();
    ctx.ellipse(w * 0.34, -h * 0.56, w * 0.24, h * 0.24, 0, 0, Math.PI * 2);
    ctx.fillStyle = '#9a6c42';
    ctx.fill();

    // 耳
    ctx.fillStyle = '#7a5330';
    ctx.beginPath();
    ctx.ellipse(w * 0.24, -h * 0.8, w * 0.08, h * 0.09, 0, 0, Math.PI * 2);
    ctx.fill();

    // ほっぺ
    ctx.beginPath();
    ctx.ellipse(w * 0.44, -h * 0.42, w * 0.13, h * 0.13, 0, 0, Math.PI * 2);
    ctx.fillStyle = '#b28657';
    ctx.fill();

    // 目
    ctx.fillStyle = '#2a1a0c';
    ctx.beginPath();
    ctx.arc(w * 0.42, -h * 0.6, w * 0.045, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.arc(w * 0.435, -h * 0.615, w * 0.015, 0, Math.PI * 2);
    ctx.fill();

    // 前歯(出っ歯)
    ctx.fillStyle = '#fdf6da';
    ctx.fillRect(w * 0.5, -h * 0.42, w * 0.05, h * 0.09);
    ctx.fillRect(w * 0.55, -h * 0.42, w * 0.05, h * 0.09);
    ctx.strokeStyle = '#c9b978';
    ctx.lineWidth = 1;
    ctx.strokeRect(w * 0.5, -h * 0.42, w * 0.1, h * 0.09);

    // ひげ
    ctx.strokeStyle = 'rgba(60,40,20,0.5)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(w * 0.5, -h * 0.5); ctx.lineTo(w * 0.68, -h * 0.53);
    ctx.moveTo(w * 0.5, -h * 0.46); ctx.lineTo(w * 0.68, -h * 0.44);
    ctx.stroke();

    ctx.restore();
  }

  const COYOTE_TIME = 0.11;
  const JUMP_BUFFER_TIME = 0.13;
  function requestJump() { player.jumpBuffer = JUMP_BUFFER_TIME; }

  canvas.addEventListener('pointerdown', (e) => {
    e.preventDefault();
    if (state === 'playing') requestJump();
  }, { passive: false });
  canvas.addEventListener('contextmenu', e => e.preventDefault());

  let particles = [];
  function spawnScoreParticle(x, y, text, good) {
    particles.push({ type: 'text', x, y, text, good, vy: -60, life: 0.7, age: 0 });
    for (let i = 0; i < 8; i++) {
      const ang = Math.random() * Math.PI * 2;
      particles.push({
        type: 'spark', x, y,
        vx: Math.cos(ang) * (50 + Math.random() * 80),
        vy: Math.sin(ang) * (50 + Math.random() * 80),
        life: 0.35 + Math.random() * 0.25, age: 0, good
      });
    }
  }
  function updateParticles(dt) {
    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.age += dt;
      if (p.age >= p.life) { particles.splice(i, 1); continue; }
      if (p.type === 'text') p.y += p.vy * dt;
      else { p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 260 * dt; }
    }
  }
  function drawParticles(camXv) {
    for (const p of particles) {
      const a = 1 - p.age / p.life;
      const sx = p.x - camXv;
      if (p.type === 'text') {
        ctx.font = `800 ${Math.max(16, BS * 0.55)}px "Baloo 2", sans-serif`;
        ctx.textAlign = 'center';
        ctx.fillStyle = p.good ? `rgba(56,224,192,${a})` : `rgba(255,90,120,${a})`;
        ctx.fillText(p.text, sx, p.y);
      } else {
        ctx.beginPath();
        ctx.fillStyle = p.good ? `rgba(242,193,78,${a})` : `rgba(228,83,107,${a})`;
        ctx.arc(sx, p.y, 2.4, 0, Math.PI * 2);
        ctx.fill();
      }
    }
  }

  let state = 'ready';
  let score = 0, highScore = 0;
  let camX = 0, speed = 0, distance = 0;

  function resetGame() {
    resetTerrain();
    resetPlayer();
    particles = [];
    score = 0;
    camX = 0;
    speed = BASE_SPEED;
    distance = 0;
    ensureGenerated(W + BS * 20);
  }

  function startGame() {
    resetGame();
    state = 'playing';
    startOverlay.classList.add('hidden');
    overOverlay.classList.add('hidden');
  }

  function endGame(reason) {
    state = 'gameover';
    const isRecord = score > highScore;
    if (isRecord) highScore = score;
    document.getElementById('finalScore').textContent = score;
    document.getElementById('finalHi').textContent = highScore;
    document.getElementById('reasonText').textContent = reason;
    document.getElementById('recordText').classList.toggle('hidden', !isRecord);
    overOverlay.classList.remove('hidden');
  }

  startBtn.addEventListener('click', startGame);
  retryBtn.addEventListener('click', startGame);

  function colAt(worldX) { return Math.floor(worldX / BS); }

  function update(dt) {
    distance += speed * dt;
    speed = clamp(BASE_SPEED + distance * 0.012, BASE_SPEED, MAX_SPEED);
    camX += speed * dt;
    ensureGenerated(camX + W + BS * 20);

    const playerScreenX = W * PLAYER_SCREEN_X_RATIO;
    const playerWorldX = camX + playerScreenX;
    player.x = playerScreenX;
    player.animT += dt;

    player.vy += GRAVITY * dt;
    player.y += player.vy * dt;

    const footWorldX = playerWorldX + player.w / 2;
    const footCol = colAt(footWorldX);
    const colData = columns[footCol];

    if (player.onGround) player.coyote = COYOTE_TIME; else player.coyote -= dt;
    if (player.jumpBuffer > 0) player.jumpBuffer -= dt;

    let grounded = false;
    if (colData && !colData.hole) {
      const gy = groundYForLevel(colData.level);
      if (player.y + player.h >= gy && player.vy >= 0) {
        player.y = gy - player.h;
        player.vy = 0;
        grounded = true;
      }
    }
    player.onGround = grounded;

    // 穴に沈み込んだら即ゲームオーバー(高速移動で奥の地面に着地判定される前に検出)
    if (colData && colData.hole) {
      const pitGroundY = groundYForLevel(colData.level);
      if (player.y + player.h > pitGroundY + BS * 0.55) {
        endGame('穴に落ちてしまった');
        return;
      }
    }

    if (player.jumpBuffer > 0 && (player.onGround || player.coyote > 0)) {
      player.vy = JUMP_V;
      player.onGround = false;
      player.coyote = 0;
      player.jumpBuffer = 0;
    }

    const frontWorldX = playerWorldX + player.w + 2;
    const frontCol = colAt(frontWorldX);
    const frontData = columns[frontCol];
    if (frontData && !frontData.hole && frontData.wallFace) {
      const wallTop = groundYForLevel(frontData.level);
      const tolerance = BS * 0.18;
      if (player.y + player.h > wallTop + tolerance) {
        endGame('ブロックに横から激突した');
        return;
      }
    }

    if (player.y > H + BS * 2) {
      endGame('穴に落ちてしまった');
      return;
    }

    for (const c of coins) {
      if (c.taken) continue;
      if (c.x < camX - BS * 3) continue;
      if (c.x > camX + W + BS * 3) break;
      const dx = c.x - (playerWorldX + player.w / 2);
      const dy = c.y - (player.y + player.h / 2);
      const rr = BS * 0.55;
      if (Math.hypot(dx, dy) < rr) {
        c.taken = true;
        if (c.value === 9) {
          spawnScoreParticle(c.x - camX, c.y, '9!!', false);
          endGame('9に触れてしまった');
          return;
        }
        score += c.value;
        spawnScoreParticle(c.x - camX, c.y, '+' + c.value, true);
      }
    }

    updateParticles(dt);
    for (const cl of clouds) {
      cl.x += cl.speed * dt * 0.3;
      if (cl.x > 1200) cl.x = -200;
    }
  }

  function drawSky() {
    const g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, '#94d9f4');
    g.addColorStop(1, '#cfeefd');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);
    for (const cl of clouds) drawCloud(cl.x, cl.y, cl.s);
  }

  // 列・段ごとに決定的な疑似乱数(見た目のガタつき防止)で小石を配置
  function pebbleSeed(col, row) {
    const n = Math.sin(col * 12.9898 + row * 78.233) * 43758.5453;
    return n - Math.floor(n);
  }

  function roundRectPath(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function drawBlockColumn(screenX, level, colIndex) {
    const topY = groundYForLevel(level);
    const capH = BS * 0.34;
    // 土台(ブロック1個ずつグリッド+小石)
    let y = topY + capH;
    let row = 0;
    while (y < H) {
      const h = Math.min(BS, H - y);
      ctx.fillStyle = '#96663a';
      ctx.fillRect(screenX, y, BS, h);
      ctx.strokeStyle = 'rgba(60,35,15,0.35)';
      ctx.lineWidth = 1;
      ctx.strokeRect(screenX + 0.5, y + 0.5, BS - 1, h - 1);
      // 小石テクスチャ(決定的な疑似乱数)
      const p1 = pebbleSeed(colIndex, row);
      const p2 = pebbleSeed(colIndex + 0.5, row);
      ctx.fillStyle = 'rgba(115,75,40,0.7)';
      ctx.beginPath();
      ctx.arc(screenX + BS * (0.25 + p1 * 0.15), y + BS * (0.35 + p1 * 0.2), BS * 0.035, 0, Math.PI * 2);
      ctx.fill();
      ctx.beginPath();
      ctx.arc(screenX + BS * (0.6 + p2 * 0.2), y + BS * (0.55 + p2 * 0.15), BS * 0.03, 0, Math.PI * 2);
      ctx.fill();
      y += BS;
      row++;
    }
    // 草ブロック(角丸+ギザギザの下端)
    const gx = screenX + 1.5, gw = BS - 3;
    roundRectPath(gx, topY, gw, capH + 6, Math.min(7, BS * 0.16));
    ctx.fillStyle = '#63c850';
    ctx.fill();
    ctx.beginPath();
    const bumps = 4;
    const by = topY + capH * 0.62;
    ctx.moveTo(gx, by);
    for (let i = 0; i < bumps; i++) {
      const bx0 = gx + (gw / bumps) * i;
      const bx1 = gx + (gw / bumps) * (i + 0.5);
      const bx2 = gx + (gw / bumps) * (i + 1);
      ctx.quadraticCurveTo(bx1, by + capH * 0.4, bx2, by);
    }
    ctx.lineTo(gx + gw, topY);
    ctx.lineTo(gx, topY);
    ctx.closePath();
    ctx.fillStyle = '#4fa93f';
    ctx.fill();
  }

  function drawPit(screenX, level) {
    const topY = groundYForLevel(level);
    const g = ctx.createLinearGradient(0, topY, 0, H);
    g.addColorStop(0, '#2a3a42');
    g.addColorStop(1, '#12191d');
    ctx.fillStyle = g;
    ctx.fillRect(screenX, topY, BS, H - topY);
  }

  function drawTerrain() {
    const startCol = Math.max(0, colAt(camX) - 1);
    const endCol = colAt(camX + W) + 2;
    for (let i = startCol; i <= endCol; i++) {
      const colData = columns[i];
      if (!colData) continue;
      const screenX = i * BS - camX;
      if (colData.hole) {
        drawPit(screenX, colData.level);
      } else {
        drawBlockColumn(screenX, colData.level, i);
      }
    }
  }

  function drawMine(sx, sy, r) {
    const spikes = 8;
    const t = performance.now() / 260;
    ctx.save();
    ctx.shadowColor = `rgba(196,18,48,${0.45 + Math.sin(t) * 0.2})`;
    ctx.shadowBlur = 10;
    ctx.beginPath();
    for (let i = 0; i < spikes; i++) {
      const a0 = (i / spikes) * Math.PI * 2;
      const a1 = ((i + 0.5) / spikes) * Math.PI * 2;
      const a2 = ((i + 1) / spikes) * Math.PI * 2;
      const px = sx + Math.cos(a1) * r * 1.55;
      const py = sy + Math.sin(a1) * r * 1.55;
      if (i === 0) ctx.moveTo(sx + Math.cos(a0) * r, sy + Math.sin(a0) * r);
      else ctx.lineTo(sx + Math.cos(a0) * r, sy + Math.sin(a0) * r);
      ctx.lineTo(px, py);
      ctx.lineTo(sx + Math.cos(a2) * r, sy + Math.sin(a2) * r);
    }
    ctx.closePath();
    ctx.fillStyle = '#a30f36';
    ctx.fill();
    ctx.restore();

    const grad = ctx.createRadialGradient(sx - r * 0.3, sy - r * 0.3, r * 0.15, sx, sy, r);
    grad.addColorStop(0, '#e33a63');
    grad.addColorStop(1, '#c41230');
    ctx.beginPath();
    ctx.arc(sx, sy, r, 0, Math.PI * 2);
    ctx.fillStyle = grad;
    ctx.fill();
    ctx.lineWidth = Math.max(1.5, r * 0.12);
    ctx.strokeStyle = '#8a0e28';
    ctx.stroke();
  }

  function drawCoins() {
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    for (const c of coins) {
      if (c.taken) continue;
      const sx = c.x - camX;
      if (sx < -BS || sx > W + BS) continue;
      const danger = c.value === 9;
      const r = BS * (danger ? 0.3 : 0.32);
      const bob = Math.sin((c.x * 0.02) + performance.now() / 260) * 4;
      const sy = c.y + bob;

      if (danger) {
        drawMine(sx, sy, r);
      } else {
        ctx.beginPath();
        ctx.fillStyle = '#c9971f';
        ctx.arc(sx, sy, r, 0, Math.PI * 2);
        ctx.fill();
        ctx.beginPath();
        ctx.fillStyle = '#f6d94a';
        ctx.arc(sx, sy, r * 0.82, 0, Math.PI * 2);
        ctx.fill();
        ctx.beginPath();
        ctx.strokeStyle = 'rgba(255,246,200,0.85)';
        ctx.lineWidth = Math.max(1.5, r * 0.12);
        ctx.arc(sx, sy, r * 0.58, 0, Math.PI * 2);
        ctx.stroke();
      }

      ctx.fillStyle = danger ? '#fff' : '#7f6400';
      ctx.font = `700 ${r * 1.2}px -apple-system,"Segoe UI",sans-serif`;
      ctx.fillText(String(c.value), sx, sy + r * 0.06);
    }
  }

  function drawHud() {
    ctx.textAlign = 'left';
    ctx.textBaseline = 'alphabetic';
    ctx.font = `700 ${Math.max(15, W * 0.026)}px -apple-system,"Segoe UI",sans-serif`;
    const text = `SCORE: ${score}   HI: ${highScore}`;
    ctx.fillStyle = 'rgba(0,0,0,0.25)';
    ctx.fillText(text, 17, 27);
    ctx.fillStyle = '#fff';
    ctx.fillText(text, 16, 26);
  }

  let lastTs = 0;
  function frame(ts) {
    if (!lastTs) lastTs = ts;
    let dt = (ts - lastTs) / 1000;
    lastTs = ts;
    dt = Math.min(dt, 0.033);

    if (state === 'playing') update(dt);
    else { for (const cl of clouds) { cl.x += cl.speed * dt * 0.3; if (cl.x > 1200) cl.x = -200; } }

    ctx.clearRect(0, 0, W, H);
    drawSky();
    drawTerrain();
    drawCoins();
    if (state !== 'ready') {
      drawKuiya(player.x, player.y, player.w, player.h, player.onGround, player.animT);
    } else {
      drawKuiya(W * PLAYER_SCREEN_X_RATIO, groundYForLevel(1) - BS * 0.82, BS * 0.82, BS * 0.82, true, performance.now() / 1000);
    }
    drawParticles(camX);
    if (state === 'playing') drawHud();

    requestAnimationFrame(frame);
  }

  window.addEventListener('resize', resize);
  resize();
  resetTerrain();
  resetPlayer();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
